name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint:
    name: ShellCheck & Syntax Check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning

      - name: Check Bash Syntax
        run: |
          bash -n deploy_wrapper.sh
          bash -n deploy/netscaler.sh

  test:
    name: Bats Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Bats
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats

      - name: Run Bats Tests
        run: bats tests/
